name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Server build/vet/test
        working-directory: server
        run: |
          go build ./...
          go vet ./...
          go test ./...
      - name: Agent build/vet/test (linux)
        working-directory: agent
        run: |
          go build ./...
          go vet ./...
          go test ./...
      - name: Agent cross-compile (windows/amd64)
        working-directory: agent
        run: GOOS=windows GOARCH=amd64 go build -o agent.exe ./cmd/agent

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build
