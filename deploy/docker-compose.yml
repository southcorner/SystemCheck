services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-systemcheck}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in server.env}
      POSTGRES_DB: ${DB_NAME:-systemcheck}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-systemcheck}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in server.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in server.env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The server is run with `go run ./cmd/server` during development, or added here
  # as a build once containerized. It reads configuration from server.env.
  # server:
  #   build: ../server
  #   env_file: server.env
  #   depends_on:
  #     db: { condition: service_healthy }
  #     minio: { condition: service_healthy }
  #   ports:
  #     - "8443:8443"

volumes:
  db_data:
  minio_data:
